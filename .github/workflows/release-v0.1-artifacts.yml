name: Build Release v0.1-pilot Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.0-pilot)'
        required: true
  push:
    tags:
      - 'v0.1.0-pilot'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-appimage-deb:
    name: Build AppImage + .deb (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            dpkg \
            dpkg-dev \
            build-essential \
            libayatana-appindicator3-dev

      - name: Install npm dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Run backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Build Tauri application
        run: npm run tauri build
        continue-on-error: true

      - name: Check AppImage generation
        run: |
          ls -lah target/release/bundle/appimage/ || echo "AppImage not generated"

      - name: Check .deb generation
        run: |
          ls -lah target/release/bundle/deb/ || echo ".deb not generated"

      - name: Upload AppImage artifact
        if: hashFiles('target/release/bundle/appimage/*.AppImage') != ''
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: target/release/bundle/appimage/*.AppImage
          retention-days: 90

      - name: Upload .deb artifact
        if: hashFiles('target/release/bundle/deb/*.deb') != ''
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/release/bundle/deb/*.deb
          retention-days: 90

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: target/release/gestion-cimetiere
          retention-days: 90

  build-nsis:
    name: Build NSIS .exe (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Run backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Build Tauri application
        run: npm run tauri build

      - name: Check NSIS generation
        run: |
          if (Test-Path "target/release/bundle/nsis") {
            Get-ChildItem "target/release/bundle/nsis" -Recurse
          } else {
            Write-Host "NSIS not generated"
          }

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: nsis
          path: target/release/bundle/nsis/*.exe
          retention-days: 90

  create-github-release:
    name: Create GitHub Release
    needs: [build-appimage-deb, build-nsis]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find . -type f -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name 'gestion-cimetiere'
          ls -lah

      - name: Create Release Notes
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          # Gestion Cimetière v0.1 Pilot Release

          ## Overview
          MVP complet pour test mairie pilote.

          ## Features
          - ✅ Gestion cimetière complète (cimetières, emplacements, concessions)
          - ✅ Gestion métier (défunts, inhumations, alertes d'échéance)
          - ✅ Interface desktop (Tauri + React + TypeScript)
          - ✅ Cartographie interactive (SVG rendering)
          - ✅ Génération PDF administratif
          - ✅ Sauvegarde/restauration locale
          - ✅ Tests (91 backend tests, 9 E2E scenarios)

          ## Installation

          ### Windows
          Download `Gestion_Cimetiere_0.1.0_x64.exe` and run installer.

          ### Linux (Ubuntu/Debian)
          ```bash
          # Option 1: AppImage (portable)
          chmod +x Gestion_Cimetiere_0.1.0_x64.AppImage
          ./Gestion_Cimetiere_0.1.0_x64.AppImage

          # Option 2: Debian package
          sudo apt install ./gestion-cimetiere_0.1.0_amd64.deb
          ```

          ## Known Limitations
          - Pilot phase: minimal features, data loss possible
          - No automatic updates
          - Local database only (no cloud sync)

          ## Support
          For pilot issues, contact: [support contact]

          ## Audit Report
          See reports/qa/mvp27_final_release_audit.md for complete QA audit.
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: RELEASE_NOTES.md
          files: |
            appimage/*
            deb/*
            nsis/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Build Summary
    needs: [build-appimage-deb, build-nsis]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Summary
        run: |
          echo "=== Release v0.1-pilot Build Summary ==="
          echo ""
          echo "Artifacts:"
          find . -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name 'gestion-cimetiere' \) -exec ls -lh {} \;
          echo ""
          echo "=== Ready for GitHub Release ==="
